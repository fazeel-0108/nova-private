name: Build Nova Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x "$(find "$ANDROID_HOME" -name gradle 2>/dev/null | head -1)" 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon || (gradle wrapper --gradle-version 8.6 && ./gradlew assembleDebug --no-daemon)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
