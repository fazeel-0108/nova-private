name: Build Nova Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: no setup-android step — the ubuntu-latest runner ships with the
      # full Android SDK preinstalled (ANDROID_HOME set, licenses accepted).
      # The old setup-android + sdkmanager-licenses step failed before Gradle
      # could start and was the only fragile part left.

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "java: $(java -version 2>&1 | head -1)"
          ls -la gradlew gradle/wrapper/
          chmod +x gradlew
          ./gradlew --version 2>&1 | tee build-log.txt
          S1=${PIPESTATUS[0]}
          if [ "$S1" -ne 0 ]; then exit "$S1"; fi
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build-log.txt
          exit ${PIPESTATUS[0]}

      # On failure the exact reason is printed on the run's Summary page.
      - name: Print failure reason
        if: failure()
        run: |
          echo "### Build failed — last 80 log lines" >> $GITHUB_STEP_SUMMARY
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_STEP_SUMMARY
          tail -n 80 android/build-log.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no build log — see the failing step's own log" >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
