<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Nova relay</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #070a13; color: #e8eefc; font: 15px/1.6 Inter, system-ui, sans-serif; }
    .card { max-width: 30rem; padding: 28px 30px; border: 1px solid #1e2740; border-radius: 16px;
            background: #0b0f1a; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 6px 0; color: #9fb0d0; font-size: 13.5px; }
    code { background: #131a2b; padding: 1px 6px; border-radius: 6px; color: #bcd0f5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nova relay</h1>
    <p>This origin serves the server-side routes for the Nova app: <code>/api/chat</code>,
      <code>/api/health</code>, <code>/api/sync</code> and <code>/api/gate</code>.</p>
    <p>It holds the provider API keys, so they never reach the browser. There is nothing to
      see here — open the Nova app instead.</p>
  </div>
</body>
</html>
